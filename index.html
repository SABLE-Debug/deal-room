<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Deal Room</title>
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-dealroom.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Deal Room">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --carbon:#0a0a0b; --carbon-2:#111113; --panel:#161618; --line:#262629;
    --ink:#ededed; --mute:#8a8a8f; --faint:#5a5a60;
    --orange:#ff5a1f; --orange-soft:#ff7a47; --green:#36d399; --red:#f0506e; --amber:#f2c14e;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,sans-serif;
    --serif:"Cormorant Garamond",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--carbon);color:var(--ink);font-family:var(--sans)}
  body{overflow-x:hidden;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh}
  .label{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--faint)}
  .wrap{flex:1;width:100%;max-width:600px;margin:0 auto;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:flex;flex-direction:column}
  button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
  .hidden{display:none!important}

  /* header */
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 0 14px;margin-top:calc(0px - env(safe-area-inset-top));position:sticky;top:0;background:linear-gradient(180deg,var(--carbon) 80%,transparent);z-index:5}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand b{font-family:var(--serif);font-weight:600;font-size:21px;}
  .brand .tick{font-family:var(--mono);font-size:9px;color:var(--orange);border:1px solid var(--line);padding:3px 6px;border-radius:4px}
  .gear{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--mute);font-size:16px;background:var(--carbon-2)}
  .gear:active{border-color:var(--orange);color:var(--orange)}

  /* intro line */
  .eyebrow{margin:6px 0 2px}
  .h1{font-family:var(--serif);font-size:32px;line-height:1.05;font-weight:600;margin:2px 0 4px}
  .sub{color:var(--mute);font-size:13.5px;line-height:1.5;margin-bottom:18px}

  /* rank strip */
  .rankstrip{border:1px solid var(--line);background:linear-gradient(170deg,var(--panel),var(--carbon-2));border-radius:12px;padding:13px 15px;margin-bottom:16px}
  .rankstrip .rtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
  .rankstrip .rname{font-family:var(--serif);font-size:18px;font-weight:600}
  .rankstrip .rnext{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--faint);text-align:right}
  .rbar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
  .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-soft));border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}

  /* 3-mode rank strip (home) */
  .ranks3{display:flex;flex-direction:column;gap:13px}
  .r3 .r3top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .r3 .r3mode{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
  .r3 .r3rank{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:7px}
  .r3 .r3meta{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .r3 .rbar{height:5px}
  .weak{font-family:var(--mono);font-size:8.5px;color:var(--amber);border:1px solid rgba(242,193,78,.35);border-radius:20px;padding:2px 7px}

  /* persona grid — cinematic cards */
  .grid{display:flex;flex-direction:column;gap:13px;padding-bottom:30px}
  .card{position:relative;border:1px solid var(--line);background:var(--carbon-2);border-radius:15px;overflow:hidden;transition:border-color .18s,transform .12s,box-shadow .2s}
  .card:active{transform:scale(.992)}
  .card:hover{border-color:rgba(255,90,31,.35);box-shadow:0 8px 30px -12px rgba(0,0,0,.6)}
  .cardtop{position:relative;height:150px;background:linear-gradient(135deg,var(--panel),#0d0d0f)}
  .cardtop .cimg{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block}
  .cardtop.noimg .cimg{display:none}
  .cardtop.noimg::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 100% at 78% 0%,rgba(255,90,31,.12),transparent 55%)}
  .cardtop .cgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,15,.12) 0%,rgba(13,13,15,0) 38%,rgba(13,13,15,.93) 100%)}
  .cardtop .cnamewrap{position:absolute;left:16px;right:16px;bottom:12px;z-index:2}
  .cardtop .cnamewrap .cname{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.06;text-shadow:0 1px 14px rgba(0,0,0,.55)}
  .cardtop .cnamewrap .crole{color:#d2d2d5;font-size:12px;margin-top:3px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .cardtop .cdiff{position:absolute;top:11px;right:11px;z-index:2;background:rgba(13,13,15,.5);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  .cardbody{padding:13px 16px 15px}
  .cardbody .sell{font-size:12.5px;color:var(--mute);line-height:1.45}
  .cardbody .sell b{color:var(--ink);font-weight:500}
  .cardbody .ctags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:4px 9px}
  .tag.diff-brutal{color:var(--red);border-color:rgba(240,80,110,.35)}
  .tag.diff-hard{color:var(--amber);border-color:rgba(242,193,78,.35)}
  .tag.diff-warm{color:var(--green);border-color:rgba(54,211,153,.35)}
  .tag.pts{color:var(--faint)}
  .tag.delx{color:var(--faint);margin-left:auto;background:none}
  .tag.delx:active{color:var(--red);border-color:rgba(240,80,110,.45)}
  /* custom-prospect cards */
  .card.customcta{display:block;text-align:left;padding:0;width:100%;border-style:dashed;border-color:rgba(255,90,31,.32)}
  .card.customcta:active{transform:scale(.992)}
  .card.customcta .cardtop{height:152px}
  .card.customcta .ccta{position:absolute;top:33%;left:50%;transform:translate(-50%,-50%);z-index:1}
  .card.customcta .cplus{display:grid;place-items:center;width:46px;height:46px;border-radius:13px;border:1px solid rgba(255,90,31,.4);background:rgba(255,90,31,.1);color:var(--orange-soft);font-size:26px;font-weight:300;line-height:1}
  .custombadge{position:absolute;top:11px;left:11px;z-index:2;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--orange-soft);background:rgba(13,13,15,.5);border:1px solid rgba(255,90,31,.35);border-radius:20px;padding:3px 8px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}

  /* history / trajectory */
  .trajcard{border:1px solid var(--line);background:linear-gradient(170deg,var(--panel),var(--carbon-2));border-radius:13px;padding:14px 15px;margin-bottom:12px}
  .trajcard .ttop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:11px}
  .trajcard .tmode{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:6px}
  .trajcard .tn{font-family:var(--mono);font-size:8.5px;color:var(--faint)}
  .trajstats{display:flex;gap:10px}
  .tstat{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--carbon-2)}
  .tstat .tk{font-family:var(--mono);font-size:8.5px;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
  .tstat .tv{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1;color:var(--ink)}
  .tstat .tv small{font-size:13px;color:var(--mute)}
  .spark{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:8px}
  .spark i{flex:1;background:linear-gradient(180deg,var(--orange-soft),var(--orange));border-radius:2px;min-height:3px;opacity:.85}
  .spark i.lastbar{background:linear-gradient(180deg,#fff,var(--orange-soft))}
  .histrow{border:1px solid var(--line);background:var(--carbon-2);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .histrow .htop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .histrow .hname{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px;min-width:0}
  .histrow .hname .hnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .histrow .hres{font-family:var(--mono);font-size:9px;text-transform:uppercase;border-radius:20px;padding:3px 8px;white-space:nowrap;flex-shrink:0}
  .histrow .hres.won{color:var(--green);border:1px solid rgba(54,211,153,.4)}
  .histrow .hres.lost{color:var(--red);border:1px solid rgba(240,80,110,.4)}
  .histrow .hmeta{font-family:var(--mono);font-size:9.5px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .histrow .hmeta .ov{color:var(--mute)}
  .histrow .hfix{font-size:12.5px;line-height:1.45;color:var(--mute);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .histrow .hfix b{color:var(--orange-soft);font-weight:500}
  .cbadge{font-family:var(--mono);font-size:8px;color:var(--orange-soft);border:1px solid rgba(255,90,31,.35);border-radius:20px;padding:1px 6px}
  .emptyhist{border:1px dashed var(--line);border-radius:13px;padding:26px 18px;text-align:center;color:var(--mute);font-size:13.5px;line-height:1.55}

  /* setup / settings */
  .field{margin-bottom:15px}
  .field label{display:block;margin-bottom:6px}
  .field input{width:100%;background:var(--carbon-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:13px 13px}
  .field input:focus{outline:none;border-color:var(--orange)}
  .field .hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.45}
  .field .hint a{color:var(--orange-soft);text-decoration:none}
  .btn{display:block;width:100%;text-align:center;background:var(--orange);color:#140a04;font-weight:600;font-size:15px;padding:15px;border-radius:11px;transition:background .15s,transform .12s}
  .btn:active{background:var(--orange-soft);transform:scale(.99)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .btn.ghost:active{border-color:var(--orange)}
  .btn[disabled]{opacity:.5;pointer-events:none}
  .btn-row{display:flex;flex-direction:column;gap:10px;padding-bottom:34px;margin-top:4px}

  /* mode toggle (segmented) */
  .modeseg{display:flex;gap:6px;background:var(--carbon-2);border:1px solid var(--line);border-radius:13px;padding:5px;margin:6px 0 14px}
  .modeseg button{flex:1;padding:11px 4px;border-radius:9px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s}
  .modeseg button .mi{font-size:17px;line-height:1}
  .modeseg button.on{background:linear-gradient(170deg,rgba(255,90,31,.2),rgba(255,90,31,.05));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,90,31,.45)}
  .modeline{font-size:13px;color:var(--mute);line-height:1.55;margin:0 0 16px;padding:0 2px}
  .modeline b{color:var(--orange-soft);font-weight:600}

  /* Lions Den (blind / real tier) */
  .lions{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid rgba(240,80,110,.4);background:linear-gradient(170deg,rgba(240,80,110,.1),rgba(240,80,110,.02));border-radius:13px;padding:12px 14px;margin:0 0 14px;transition:transform .12s,border-color .15s,background .15s}
  .lions:active{transform:scale(.99)}
  .lions.on{border-color:var(--red);background:linear-gradient(170deg,rgba(240,80,110,.22),rgba(240,80,110,.05));box-shadow:inset 0 0 0 1px rgba(240,80,110,.5)}
  .lions .li{font-size:24px;line-height:1}
  .lions .lt{flex:1}
  .lions .lt .ln{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink)}
  .lions .lt .ld{font-size:11.5px;color:var(--mute);margin-top:1px}
  .lions .lx{font-family:var(--mono);font-size:9px;color:var(--red);border:1px solid rgba(240,80,110,.45);border-radius:20px;padding:4px 8px;white-space:nowrap}
  .lions.on .lx{background:var(--red);color:#fff;border-color:var(--red)}
  .blind{border:1px solid rgba(240,80,110,.4);background:linear-gradient(170deg,rgba(240,80,110,.08),transparent);border-radius:13px;padding:15px 16px;margin-bottom:6px}
  .blind .blab{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--red);margin-bottom:8px}
  .blind p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink)}
  .blind p b{color:#fff;font-weight:600}
  .r3.real .r3mode{color:var(--red)}
  .r3.real .rbar i{background:linear-gradient(90deg,var(--red),#ff8fa0)}

  /* playbook */
  .pblink{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:linear-gradient(170deg,var(--panel),var(--carbon-2));border-radius:13px;padding:13px 15px;margin:14px 0 0;transition:transform .12s,border-color .15s}
  .pblink:active{transform:scale(.99)}
  .pblink:hover{border-color:rgba(255,90,31,.35)}
  .pblink .pli{font-size:22px}
  .pblink .plt{flex:1}
  .pblink .plt .pln{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
  .pblink .plt .pld{font-size:11.5px;color:var(--mute);margin-top:1px}
  .pblink .plx{color:var(--orange-soft);font-size:16px}
  .pbinline{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11px;color:var(--orange-soft);margin:-6px 0 14px}
  .pbread{border:1px solid var(--line);background:var(--carbon-2);border-radius:12px;padding:13px 14px;margin-bottom:14px}
  .pbread .blab{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--orange-soft);margin-bottom:6px}
  .pbread p{margin:0;font-size:13px;line-height:1.55;color:var(--ink)}
  .chain{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
  .chain .blab{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
  .chainrow{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
  .chainrow .cue{font-size:12.5px;font-weight:600;color:var(--ink);background:rgba(255,90,31,.1);border:1px solid rgba(255,90,31,.25);border-radius:8px;padding:5px 9px}
  .chainrow .cue.weakcue{background:rgba(242,193,78,.14);border-color:rgba(242,193,78,.4);color:var(--amber)}
  .chainrow .arr{color:var(--faint);font-size:13px}
  .pbstep{border:1px solid var(--line);background:var(--carbon-2);border-radius:13px;padding:14px 15px;margin-bottom:11px}
  .pbstep.weak{border-color:rgba(242,193,78,.45);background:linear-gradient(170deg,rgba(242,193,78,.06),var(--carbon-2))}
  .pbtop{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
  .pbnum{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#140a04;font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
  .pbcue{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink)}
  .pbweak{font-family:var(--mono);font-size:8.5px;color:var(--amber);border:1px solid rgba(242,193,78,.4);border-radius:20px;padding:2px 7px}
  .pbsk{margin-left:auto;font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--faint)}
  .pbmove{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:11px}
  .pbsay,.pblisten{border-top:1px dashed var(--line);padding-top:9px;margin-top:9px}
  .sublab{font-family:var(--mono);font-size:9px;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
  .pbsay p{margin:0 0 5px;font-size:13.5px;line-height:1.5;color:var(--orange-soft)}
  .pblisten p{margin:0;font-size:13px;line-height:1.5;color:var(--mute)}

  /* briefing */
  .brief{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
  .briefrow{position:relative;border:1px solid var(--line);background:var(--carbon-2);border-radius:13px;padding:14px 15px;overflow:hidden}
  .briefrow .blab{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--orange-soft);margin-bottom:7px}
  .briefrow p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .briefrow p b{color:#fff;font-weight:600}
  .briefrow .outcome2{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);color:var(--mute);font-size:13px;line-height:1.5}
  .briefrow .outcome2 b{color:var(--green);font-weight:500}

  /* call screen */
  .call{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding-bottom:30px}
  .call .who{font-family:var(--serif);font-size:30px;font-weight:600;margin-top:6px}
  .call .whorole{color:var(--mute);font-size:13px;margin-bottom:30px}
  .callface{position:relative;width:212px;height:212px;border-radius:24px;overflow:hidden;margin-bottom:26px;border:1px solid var(--line);background:radial-gradient(circle at 40% 30%,#26262a,#0d0d0f);transition:box-shadow .3s,transform .3s,border-color .3s}
  .callface .cfimg{width:100%;height:100%;object-fit:cover;object-position:center 26%;display:block}
  .callface.noimg .cfimg{display:none}
  .callface .cfic{position:absolute;inset:0;display:none;place-items:center;font-size:42px;opacity:.7}
  .callface.noimg .cfic{display:grid}
  .callface .ring{position:absolute;inset:-2px;border-radius:26px;border:2px solid transparent;pointer-events:none}
  .callface.speaking{box-shadow:0 0 65px -6px rgba(255,90,31,.55);border-color:var(--orange);transform:scale(1.03)}
  .callface.speaking .ring{border-color:rgba(255,90,31,.4);animation:pulse 1.5s ease-out infinite}
  .callface.listening{box-shadow:0 0 48px -10px rgba(54,211,153,.45);border-color:rgba(54,211,153,.5)}
  .callface.listening .ring{border-color:rgba(54,211,153,.3);animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.16);opacity:0}}
  /* scenario hero */
  .hero{position:relative;height:190px;border-radius:16px;overflow:hidden;margin:2px 0 16px;border:1px solid var(--line);background:linear-gradient(135deg,var(--panel),#0d0d0f)}
  .hero .himg{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
  .hero.noimg .himg{display:none}
  .hero .hgrad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,13,15,.08),rgba(13,13,15,.88))}
  .hero .hname{position:absolute;left:18px;right:18px;bottom:14px}
  .hero .hname .hn{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.02;text-shadow:0 1px 14px rgba(0,0,0,.5)}
  .hero .hname .hr{color:#d4d4d7;font-size:13px;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.65)}
  .status{font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--mute);min-height:16px}
  .captions{margin-top:20px;min-height:46px;max-width:430px;font-size:15px;line-height:1.5;color:var(--ink)}
  .captions .src{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
  .endbtn{margin-top:34px;background:var(--red);color:#fff;font-weight:600;font-size:15px;padding:15px 40px;border-radius:40px;display:inline-flex;align-items:center;gap:9px}
  .endbtn:active{filter:brightness(1.1)}

  /* results */

/* ---------- storage ---------- */
const LS = {
  get:(k,d)=>{ try{ const v=localStorage.getItem("dr_"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set:(k,v)=>localStorage.setItem("dr_"+k,JSON.stringify(v))
};

/* ---------- Moloch backend (rides the Claude subscription — free grading, no API key) ---------- */
const MOLOCH = "https://moloch.tail6f2ef0.ts.net";
async function molochGrade(system, prompt, model="haiku"){
  const res = await fetch(MOLOCH+"/grade",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({system, prompt, model})
  });
  if(!res.ok) throw new Error("Grading failed: "+res.status+" "+(await res.text()).slice(0,140));
  const j = await res.json();
  let txt = (j.text||"").trim();
  const mt = txt.match(/\{[\s\S]*\}/); if(mt) txt = mt[0];
  return JSON.parse(txt);
}
async function molochReadUrl(url){
  const res = await fetch(MOLOCH+"/readurl",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({url})
  });
  if(!res.ok) throw new Error("Couldn't read that page: "+res.status+" "+(await res.text()).slice(0,140));
  return await res.json(); // {text, url}
}

/* ---------- escape model/user text before it touches innerHTML ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- progression: only CLOSING moves you up — separate ladder per mode ---------- */
const RANKS = [
  {name:"Greenhorn",    at:0},
  {name:"Cold Caller",  at:3},
  {name:"Smooth Talker",at:8},
  {name:"Negotiator",   at:16},
  {name:"Deal Maker",   at:28},
  {name:"Rainmaker",    at:44},
  {name:"Shark",        at:64},
  {name:"The Closer",   at:90}
];
const DIFF_PTS = { warm:1, hard:2, brutal:3 };
const getXP = mode => LS.get("xp_"+mode,0);
const getCloses = mode => LS.get("closes_"+mode,0);
const rankAt = xp => { let r=RANKS[0]; for(const x of RANKS) if(xp>=x.at) r=x; return r; };
const nextRankAt = xp => { for(const x of RANKS) if(x.at>xp) return x; return null; };
function rankProgress(xp){
  const cur=rankAt(xp), nxt=nextRankAt(xp);
  if(!nxt) return {cur, nxt:null, pct:100, have:0, need:0};
  const span=nxt.at-cur.at, into=xp-cur.at;
  return {cur, nxt, pct:Math.max(3,Math.round(into/span*100)), have:into, need:span};
}

/* ---------- build a prospect persona from a real company's website (Moloch reads, Claude personifies) ---------- */
function buildCustomPersonaPrompt(){
  // mirrors the PERSONAS schema exactly so a custom prospect drops straight into buildPrompt() + gradeCall()
  return `You are a sales-training scenario designer. You are given the scraped text of a REAL company's website. From it, invent ONE realistic decision-maker at that company and the exact thing a salesperson would cold-call to sell them. Ground everything in the company's actual business — what they really do, who would really hold the budget, the objections that buyer would really raise. No generic filler; make it feel like a real person at a real company.

Return STRICT JSON only — no prose, no markdown, no code fences. Use EXACTLY these keys:
{
 "name":"<realistic full name of the buyer>",
 "role":"<their title · short company descriptor, e.g. 'VP Ops · 200-store retail chain'>",
 "gender":"<male|female>",
 "difficulty":"<brutal|hard|warm>",
 "personality":"<3-8 words on how they behave on a call>",
 "mood":"<one short clause on their state right now, e.g. 'between meetings, impatient'>",
 "objections":["<4 short, in-character objections this exact buyer would actually say>"],
 "sell":"<the ONE specific product/service being sold to them, lowercase, ~6-12 words, tailored to their real business>",
 "company":"<2-3 sentences on the company's real business, scale and situation, drawn from the site>",
 "buyer":"<2-3 sentences: who this person is, what they care about, what they're wary of>",
 "issue":"<2-3 sentences on the real, specific problem the seller is there to solve and what it costs them>",
 "valueAngle":"<1-2 sentences on what solving it really buys them, in their world>",
 "first":"<exactly how they answer the phone, 2-5 words, in character, e.g. 'Yeah, this is Dana.'>"
}

Rules:
- "difficulty" MUST be exactly one of: brutal, hard, warm.
- "gender" MUST be exactly male or female.
- "objections" MUST be an array of 4 short strings.
- Keep it spoken and human. The buyer must match the company's real industry and size.
- If the page text is thin or unclear, infer a plausible business from the domain and any signal present — never refuse, always return the JSON.`;
}
function normalizeCustomPersona(raw, url){
  const diff = ["brutal","hard","warm"].includes(raw.difficulty) ? raw.difficulty : "hard";
  const gender = raw.gender==='female' ? 'female' : 'male';
  let objs = Array.isArray(raw.objections) ? raw.objections.filter(o=>typeof o==='string'&&o.trim()).slice(0,4) : [];
  if(!objs.length) objs = ["What does this actually cost","Just email me something","We already have something for that","I don't have time for this"];
  const host = (()=>{ try{ return new URL(url).hostname.replace(/^www\./,""); }catch(e){ return "custom"; } })();
  return {
    id: "custom_"+Date.now().toString(36),
    custom: true,
    sourceUrl: url,
    sourceHost: host,
    createdAt: Date.now(),
    name: (raw.name||"Unknown Buyer").toString().slice(0,60),
    role: (raw.role||host).toString().slice(0,90),
    gender,
    difficulty: diff,
    voiceId: pickVoice(gender),
    personality: (raw.personality||"guarded, busy, skeptical of vendors").toString().slice(0,160),
    mood: (raw.mood||"caught mid-task, short on time").toString().slice(0,160),
    objections: objs,
    sell: (raw.sell||"a tool that saves them time and money").toString().slice(0,140),
    company: (raw.company||"A real business reached via its website.").toString().slice(0,800),
    buyer: (raw.buyer||"The decision-maker who'd own this budget.").toString().slice(0,800),
    issue: (raw.issue||"A real, specific problem in their day-to-day that the seller can solve.").toString().slice(0,900),
    valueAngle: (raw.valueAngle||"They get the painful part of their week handed back.").toString().slice(0,500),
    first: (raw.first||"Hello?").toString().slice(0,60)
  };
}
async function generateCustomProspect(url){
  const read = await molochReadUrl(url);                 // {text, url}
  const pageText = (read.text||"").slice(0,16000);
  if(!pageText.trim()) throw new Error("That page returned no readable text. Try the company's homepage.");
  const sys = buildCustomPersonaPrompt();
  const prompt = `COMPANY WEBSITE: ${read.url||url}\n\nSCRAPED PAGE TEXT:\n${pageText}\n\nBuild the prospect now as strict JSON.`;
  const raw = await molochGrade(sys, prompt, "sonnet");   // sonnet = richer persona; same {text}→JSON extraction
  const persona = normalizeCustomPersona(raw, read.url||url);
  saveCustomProspect(persona);
  return persona;
}

const BLUEPRINTS = {
  discovery:{
    opening:{ cue:`Permission first`, move:`Earn the right to ask by naming why you're here and handing them control of the agenda.`, example:[`Before I pitch anything — mind if I ask what's actually going on first? If it's not a fit, I'll tell you.`,`Give me five minutes of questions, then you decide if it's worth more time.`], listen:`They relax and say "yeah, go ahead" instead of bracing for a pitch.` },
    questioning:{ cue:`Walk it downstream`, move:`Ask layered questions that move from their situation, to the problem, to what it's costing them.`, example:[`How are you handling that today?`,`And when that breaks, who feels it first?`,`What does that cost you in a bad month?`], listen:`They start telling you things you didn't ask — the problem spills out on its own.` },
    diagnosis:{ cue:`Name the wound`, move:`Say the problem back in your words, sharper than they did, and get them to confirm it.`, example:[`So it's not the software — it's that nobody trusts the number it spits out. Fair?`,`Sounds like the real issue is you're flying blind till month-end.`], listen:`"Exactly" — or they correct one detail and keep the frame. Either way, they own it now.` },
    listening:{ cue:`Talk less, mirror`, move:`Shut up, let silence work, and reflect back the emotional words they used — not yours.`, example:[`You said "exhausting" — say more about that.`,`…go on.  (then wait)`], listen:`They fill the silence with the thing they actually care about — usually after a pause.` },
    close:{ cue:`Earn the yes`, move:`Trade the next step for their agreement that the problem is worth solving. Never assume it.`, example:[`If we could fix exactly that, is this worth a real look?`,`What would need to be true for this to be a priority this quarter?`], listen:`They name a next step, a date, or who else needs to be in the room.` }
  },
  pitch:{
    opening:{ cue:`Outcome, not feature`, move:`Open on the outcome they want, not your product — make the first sentence about their world.`, example:[`Most people I talk to want one thing: stop losing hours to this. That's what this does.`,`Quick version — this gets you the result without the pain. Want the how?`], listen:`They lean in and ask "how does that work?" rather than "how much?"` },
    clarity:{ cue:`One breath, no jargon`, move:`Explain it in one plain line a 12-year-old gets — one core idea, zero jargon.`, example:[`It watches your numbers and texts you the second one looks wrong. That's it.`,`Think of it as a smoke alarm for your cash.`], listen:`They repeat it back in their own words — it landed, and it's portable now.` },
    objections:{ cue:`Behind the no`, move:`Welcome the pushback, ask what's behind it, then answer the real concern — not the surface line.`, example:[`Totally fair — when you say "too expensive," too expensive versus what?`,`Good — what would have to be true for the price to feel obvious?`], listen:`The objection softens into a real question ("so how would onboarding work?").` },
    value:{ cue:`Price the status quo`, move:`Anchor the price against the cost of staying put, in their numbers — make doing nothing the expensive option.`, example:[`You said a bad month runs you 10 grand. This is a fraction of one bad month.`,`What's it costing you to not fix this — every month it sits?`], listen:`They go quiet and do the math out loud, or stop arguing price entirely.` },
    close:{ cue:`Ask, then shut up`, move:`Ask for the decision directly, give a clear next action, then stop talking.`, example:[`Want to do this?`,`I'll send the link, you're live today — sound good?  (then silence)`], listen:`A clean yes, or a real objection you can work — anything but a vague "let me think about it."` }
  },
  method:{
    diagnosis:{ cue:`Find the gap`, move:`Map their world fast — current state, the gap, the cost of the gap — before you offer anything.`, example:[`Walk me through how this works today.`,`Where's it actually breaking?`,`And what does that break cost you?`], listen:`You can repeat their problem back better than they told it, and they nod.` },
    reframe:{ cue:`Teach, don't echo`, move:`Teach them something about their own problem they hadn't seen — shift the frame, don't just agree.`, example:[`Here's what most people miss — the issue isn't the tool, it's that the tool hides the real cost until it's too late.`,`You're treating this as a tooling problem. It's a trust problem.`], listen:`"Huh — I hadn't thought of it that way." The frame just moved.` },
    outcome:{ cue:`Sell the after`, move:`Paint the after — their life once it's solved — then connect your offer as the bridge to it.`, example:[`Picture month-end taking an hour instead of a week. That's the gap we close.`,`Six weeks out, you're not even thinking about this anymore. That's the goal.`], listen:`They start describing the future themselves — "yeah, and then I could finally…"` },
    objections:{ cue:`Isolate the real one`, move:`Treat every objection as a question; isolate the real one, label it, and resolve it before moving.`, example:[`Is that the only thing between us and a yes, or is there more?`,`Say price weren't an issue — would you do it? Good, so it's about value. Let's talk value.`], listen:`You're down to one true objection — and they confirm it's the last one.` },
    close:{ cue:`Assume and ask`, move:`Assume the sale, lay out the next step plainly, and ask for the commitment without flinching.`, example:[`Makes sense to move — here's step one. Good to go?`,`I'll get you set up. Card or invoice?`], listen:`They commit, schedule, or hand you a logistics question ("when can we start?") — buying signals, not stalling.` }
  }
};

/* ---------- build the role-play system prompt (persona scenario + chosen mode) ---------- */
function buildPrompt(p, mode){
  const m = MODES[mode];
  return `You are ${p.name}, ${p.role}. You are NOT an assistant — you are a real person receiving an unsolicited sales call, and you must stay fully in character the entire call. Never break character, never mention being an AI, never be helpful in an assistant-like way.

YOUR COMPANY: ${p.company}
WHO YOU ARE: ${p.personality}. ${p.buyer}
YOUR MOOD RIGHT NOW: ${p.mood}.
YOUR REAL PROBLEM (do not hand it over easily): ${p.issue}
WHAT THEY ARE TRYING TO SELL YOU: ${p.sell}.

HOW TO PLAY THIS CALL — ${m.label.toUpperCase()} MODE (${m.tag}):
${m.behavior}

GENERAL REALISM:
- This is a phone call. Speak in short, natural, spoken sentences. React like a real busy person; use filler ("look,", "honestly,", "okay but..."). Keep your turns to 1–3 sentences — fast back-and-forth, never a monologue.
- Throw realistic objections, drawn naturally from: ${p.objections.map(o=>`"${o}"`).join(", ")}. Don't list them — surface them when the salesperson gives you an opening.
- Your difficulty is ${p.difficulty.toUpperCase()}: ${p.difficulty==='brutal'?'be genuinely hard — short, skeptical, ready to end the call if they waste your time.':p.difficulty==='hard'?'be skeptical and testing, but fair if they are sharp.':'be warm and talkative, but slippery to actually commit.'}
- HOW THEY WIN: ${m.win} If and only if they genuinely earn it, gradually warm up and AGREE to a concrete next step, said plainly ("alright, let's set it up" / "okay, send me the contract"). Never agree out of politeness — only when earned. After a fair exchange, reach a decision: commit if earned, or move to wrap the call up. Don't loop forever.`;
}

/* ---------- grading (per-mode rubric) — runs free through Moloch ---------- */
async function gradeCall(persona, mode, transcript){
  const m = MODES[mode];
  const convo = transcript.map(t=>`${t.role==='me'?'SALESPERSON':persona.name.toUpperCase()}: ${t.text}`).join("\n");
  const metricSpec = m.rubric.map(r=>`"${r.key}":<1-10>`).join(",");
  const rubricDesc = m.rubric.map(r=>`- ${r.name}: ${r.desc}`).join("\n");
  const sys = `You are an elite sales coach grading a practice cold call run in ${m.label.toUpperCase()} mode (${m.tag}). The SALESPERSON was selling "${persona.sell}" to ${persona.name} (${persona.role}), a ${persona.difficulty} prospect.

In ${m.label} mode the seller wins by: ${m.win}

Grade ONLY the salesperson, on THESE metrics (each 1-10):
${rubricDesc}

Be honest and specific — this is training, flattery is useless.

"closed" = did the prospect GENUINELY agree to a concrete next step (a booked meeting/demo with real intent, a trial or purchase yes, a signature, or handing over real contact info to proceed)? Mere interest, "send me info", "I'll think about it", or just warming up is NOT a close. Be strict — a real close has to be earned.

Reply with STRICT JSON only, no prose, no markdown:
{"closed":<true|false>,${metricSpec},"overall":<1-10>,"verdict":"<one or two direct sentences — say plainly whether they closed and why>","the_one_fix":"<the single highest-leverage thing to change next call, concrete and actionable, focused on ${m.oneFix}>"}`;
  const prompt = `Here is the call transcript:\n\n${convo||"(no words were exchanged)"}\n\nGrade it now as strict JSON.`;
  return await molochGrade(sys, prompt, "haiku");
}

function ranks3(){
  const rows = RANK_ORDER.map(mk=>{ const xp=getXP(mk); return {mk, m:MODES[mk], xp, rp:rankProgress(xp)}; });
  // drill-this keys off MEASURED performance — the mode holding your real weakest rubric metric
  const measuredWeak = weakestMetricOverall();
  let weakMk = measuredWeak ? measuredWeak.mode : null;
  let weakLabel = measuredWeak ? measuredWeak.name.toLowerCase() : null;
  if(!weakMk){ // no graded data yet → fall back to the lowest-XP ladder as a hint
    const maxXp = Math.max(...rows.map(r=>r.xp)), minXp = Math.min(...rows.map(r=>r.xp));
    if(maxXp>0 && minXp<maxXp){ weakMk = rows.find(r=>r.xp===minXp).mk; }
  }
  return `<div class="rankstrip ranks3">
    ${rows.map(r=>`
      <div class="r3${r.mk==='lionsden'?' real':''}">
        <div class="r3top">
          <span class="r3mode">${r.m.icon} ${r.m.label}${r.mk==='lionsden'?` · <span style="color:var(--red)">the real one</span>`:r.mk===weakMk?` <span class="weak">drill${weakLabel?': '+weakLabel:' this'}</span>`:``}</span>
          <span class="r3rank">${r.rp.cur.name} <span class="r3meta">${r.rp.nxt?`${r.rp.have}/${r.rp.need}→${r.rp.nxt.name}`:'MAX'}</span></span>
        </div>
        <div class="rbar"><i style="width:${r.rp.pct}%"></i></div>
      </div>`).join("")}
  </div>`;
}

/* ---------- Playbook: weakness tracking + view ---------- */
function logScores(mode,grade){
  if(!grade||!MODES[mode]) return;
  const rec={}; MODES[mode].rubric.forEach(r=>{ if(typeof grade[r.key]==='number') rec[r.key]=grade[r.key]; });
  const hist=LS.get("pb_"+mode,[]); hist.push(rec); while(hist.length>8) hist.shift();
  LS.set("pb_"+mode,hist);
}
function weakestStep(mode){
  if(!MODES[mode]) return null;
  const hist=LS.get("pb_"+mode,[]); if(!hist.length) return null;
  let worst=null, wAvg=99;
  for(const r of MODES[mode].rubric){
    const vals=hist.map(h=>h[r.key]).filter(v=>typeof v==='number');
    if(!vals.length) continue;
    const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    if(avg<wAvg){ wAvg=avg; worst=r.key; }
  }
  return worst;
}

/* ---------- persisted call history + trajectory (Tasks 3 & 4) ---------- */
const HISTORY_CAP = 40;
function logHistory(mode, persona, grade){
  if(!grade||!MODES[mode]) return;
  const scores={}; MODES[mode].rubric.forEach(r=>{ if(typeof grade[r.key]==='number') scores[r.key]=grade[r.key]; });
  const rec={
    mode,
    personaName: persona?.name || "—",
    personaId: persona?.id || null,
    custom: !!persona?.custom,
    difficulty: persona?.difficulty || null,
    scores,
    overall: typeof grade.overall==='number'?grade.overall:null,
    closed: !!grade.closed,
    the_one_fix: grade.the_one_fix || "",
    timestamp: Date.now()
  };
  const hist=LS.get("history",[]); hist.push(rec); while(hist.length>HISTORY_CAP) hist.shift();
  LS.set("history",hist);
}
const getHistory = ()=> LS.get("history",[]).slice().reverse(); // newest-first
const historyForMode = mode => LS.get("history",[]).filter(h=>h.mode===mode);
function modeTrajectory(mode){
  const all=historyForMode(mode); if(!all.length) return null;
  const recent=all.slice(-10);
  const overalls=recent.map(h=>h.overall).filter(v=>typeof v==='number');
  const avg=overalls.length?overalls.reduce((a,b)=>a+b,0)/overalls.length:null;
  const closes=recent.filter(h=>h.closed).length;
  const last5=recent.slice(-5).map(h=>h.overall).filter(v=>typeof v==='number');
  return { n:all.length, recentN:recent.length, avg, closeRate:Math.round(closes/recent.length*100), last5 };
}
// across ALL recent measured calls, the single lowest-average rubric metric → the real weakness
function weakestMetricOverall(){
  let worst=null;
  for(const mode of MODE_ORDER){
    const hist=LS.get("pb_"+mode,[]); if(!hist.length) continue;
    for(const r of MODES[mode].rubric){
      const vals=hist.map(h=>h[r.key]).filter(v=>typeof v==='number');
      if(vals.length<2) continue; // need a small sample before calling it a weakness
      const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
      if(!worst||avg<worst.avg) worst={mode, key:r.key, name:r.name, avg, n:vals.length};
    }
  }
  return worst;
}

    <div class="trajstats">

}
function historyView(){

    : `<div class="emptyhist">No calls yet. Close a few and your trajectory shows up here — close-rate, average score and the moves that keep tripping you up.</div>`}`;

function relTime(ts){
  if(!ts) return "";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  const mn=Math.floor(s/60); if(mn<60) return mn+"m ago";
  const h=Math.floor(mn/60); if(h<24) return h+"h ago";
  const d=Math.floor(h/24); if(d<7) return d+"d ago";
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

    }catch(e){
      S.customBusy=false; S.customStatus="";
      render();
      toast(e.message||"Couldn't build that prospect.",5000);
    }
  },
  removeCustom(id){
    LS.set("customProspects", getCustomProspects().filter(p=>p.id!==id));
    toast("Removed"); render();
  },
  clearHistory(){
    LS.set("history",[]);
    toast("History cleared"); render();
  },

  async startCall(){
    const p=S.persona;
    S.transcript=[]; S.status="connecting…"; go("call");
    try{
      await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){ toast("Mic permission denied — needed for the call."); go("topic"); return; }
    let agentId;
    try{ agentId=getAgentId(); }
    catch(e){ toast(e.message,5000); go("setup"); return; }

    try{
      S.conversation = await Conversation.startSession({
        agentId,
        connectionType:"websocket",
        overrides:{
          agent:{ prompt:{ prompt:buildPrompt(p,S.mode) }, firstMessage:p.first, language:"en" },
          tts:{ voiceId: p.voiceId }
        },
        onConnect:()=>{ setStatus("on the line"); },
        onDisconnect:()=>{ /* handled by endCall */ },
        onError:(err)=>{ toast("Call error: "+(err&&err.message||err),4500); },
        onModeChange:(m)=>{ setOrb(m&&m.mode); },
        onStatusChange:(st)=>{ /* connected/disconnected */ },
        onMessage:(m)=>{
          const role = (m.source==='user'||m.source==='human')?'me':'them';
          const text = m.message||m.text||"";
          if(!text) return;
          S.transcript.push({role,text});
          showCaption(role,text);
        }
      });
    }catch(e){ toast("Couldn't start the call: "+(e&&e.message||e),5000); go("topic"); }
  },

  async endCall(){
    try{ if(S.conversation) await S.conversation.endSession(); }catch(e){}
    S.conversation=null;
    if(!S.transcript.length){ toast("Call ended — no speech captured."); go("home"); return; }
    go("grading");
    try{
      S.grade = await gradeCall(S.persona,S.mode,S.transcript);
      logScores(S.mode,S.grade);
      logHistory(S.mode,S.persona,S.grade);
      S.earned = 0; S.leveledUp = null;
      if(S.grade.closed){
        const before = getXP(S.mode);
        const pts = DIFF_PTS[S.persona.difficulty] || 1;
        const after = before + pts;
        LS.set("xp_"+S.mode, after);
        LS.set("closes_"+S.mode, getCloses(S.mode)+1);
        S.earned = pts;
        if(rankAt(before).name !== rankAt(after).name) S.leveledUp = rankAt(after);
      }
      go("results");
    }catch(e){ toast(e.message,5000); go("home"); }
  }
};
window.DR = DR;

function setStatus(t){ S.status=t; const el=document.getElementById("status"); if(el) el.textContent=t; }
function setOrb(mode){
  const orb=document.getElementById("callface");
  if(!orb) return;
  orb.classList.remove("speaking","listening");
  if(mode==="speaking"){ orb.classList.add("speaking"); setStatus(S.persona.name+" is speaking"); }
  else { orb.classList.add("listening"); setStatus("your turn — speak"); }
}
function showCaption(role,text){
  const el=document.getElementById("captions"); if(!el) return;
  el.innerHTML=`<span class="src">${role==='me'?'You':S.persona.name}</span>${text}`;
}

/* ---------- boot ---------- */
render();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }

/* ---------- 3D call-signal background (Three.js · bg3d.js) ---------- */
import('./bg3d.js').then(m=>m.initBackground()).catch(()=>{});
</script>
